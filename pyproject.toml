[project]
name = "dogear"
version = "0.2.0"
description = "Local coding agent with a live workspace: Claude-Code-style tools, MCP, a real browser the agent and you share, plan boards, parallel variants, memory. Runs on Ollama."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "httpx"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
dogear = "dogear.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
