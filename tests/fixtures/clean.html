<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>t</title><style>
:root{--bg:#f6f7f9;--s:#fff;--line:#e3e6ea;--text:#15181d;--muted:#5b6470;--accent:#2f6fed}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:var(--s);border-bottom:1px solid var(--line)}
main{max-width:1100px;margin:0 auto;padding:32px 24px}h1{font-size:32px;margin:0 0 8px}p{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--s);border:1px solid var(--line);border-radius:8px;padding:20px}
button{min-height:40px;padding:0 16px;border-radius:8px;border:0;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
label{display:block;font-size:14px;margin-bottom:4px}input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><header><strong>Acme</strong><button>Sign in</button></header><main><h1>Plan your week</h1><p>One page for tasks, notes and deadlines.</p>
<div class="grid"><div class="card"><h2>Tasks</h2><p>Capture and sort.</p></div><div class="card"><h2>Notes</h2><p>Write things down.</p></div><div class="card"><h2>Deadlines</h2><p>Never miss one.</p></div>
<div class="card"><h2>Search</h2><p>Find anything.</p></div><div class="card"><h2>Sync</h2><p>Every device.</p></div><div class="card"><h2>Share</h2><p>With your team.</p></div></div>
<form style="margin-top:32px;max-width:420px"><label for="e">Email</label><input id="e" type="email"><p></p><button type="submit">Subscribe</button></form></main></body></html>
